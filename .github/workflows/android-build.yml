name: Android APK build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Reconstruct and expand the Android project archive
        run: |
          mkdir -p /tmp/glass-dialer
          cat archive-parts/part-*.b64 | tr -d '\r\n' | base64 --decode > /tmp/glass-dialer/source.gz
          gzip -dc /tmp/glass-dialer/source.gz | gzip -dc | tar -xf - -C /tmp/glass-dialer
          cp -a /tmp/glass-dialer/Glass-Dialer/. .
          mkdir -p app/src/main/res/mipmap-anydpi
          cp app/src/main/res/drawable/ic_launcher.xml app/src/main/res/mipmap-anydpi/ic_launcher.xml
          cp app/src/main/res/drawable/ic_launcher.xml app/src/main/res/mipmap-anydpi/ic_launcher_round.xml
          rm -rf archive-parts GlassDialer-project.zip

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.13

      - name: Commit expanded Android Studio project (optional)
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Add Glass Dialer Android project sources"
            git push
          fi

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GlassDialer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
