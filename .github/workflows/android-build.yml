name: Android APK build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # The unpack step commits the extracted source files. Skip the follow-up bot push.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Expand and prepare Android Studio project
        run: |
          unzip -q GlassDialer-project.zip -d /tmp/glass-dialer
          cp -a /tmp/glass-dialer/Glass-Dialer/. .
          rm GlassDialer-project.zip
          python3 - <<'PY'
          from pathlib import Path

          gradle_file = Path("app/build.gradle.kts")
          source = gradle_file.read_text()
          old = """    kotlin {
                  compilerOptions {
                      jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
                  }
              }
          }

          dependencies {"""
          new = """}

          kotlin {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
              }
          }

          dependencies {"""
          if old not in source:
              raise SystemExit("Could not locate Kotlin compilerOptions block in app/build.gradle.kts")
          gradle_file.write_text(source.replace(old, new, 1))

          workflow_file = Path(".github/workflows/android-build.yml")
          workflow_text = workflow_file.read_text()
          workflow_file.write_text(workflow_text.replace("android-actions/setup-android@v3", "android-actions/setup-android@v4"))
          PY
          gradle wrapper --gradle-version 8.13

      - name: Commit expanded project and Gradle wrapper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Add Glass Dialer Android project sources"
            git push
          fi

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GlassDialer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
